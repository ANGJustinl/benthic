<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benthic: The Last Lung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'term-green': '#0f0',
              'term-dim': '#003300',
              'term-bg': '#050a05',
              'abyss-black': '#000000',
              'abyss-blue': '#000b14',
              'flesh-red': '#880000',
              'flesh-pink': '#cc6666',
              'flesh-bg': '#1a0505',
            },
            fontFamily: {
              mono: ['Courier New', 'Courier', 'monospace'],
              hand: ['Brush Script MT', 'cursive'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'heartbeat': 'heartbeat 1.5s ease-in-out infinite',
              'fade-in-slow': 'fadeInSlow 3s ease-out forwards',
              'fade-in-delayed': 'fadeInDelayed 2s ease-out 1.5s forwards',
              'fade-in-text-1': 'fadeInText 1.5s ease-out 3s forwards',
              'fade-in-text-2': 'fadeInText 1.5s ease-out 4s forwards',
            },
            keyframes: {
              heartbeat: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.02)' },
              },
              fadeInSlow: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInDelayed: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInText: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
            }
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
      /* Custom scrollbar for log */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
      .flesh-theme ::-webkit-scrollbar-thumb {
        background: #500;
      }
      /* Impact theme - red tint for text */
      .impact-theme .text-term-green {
        color: #ff6666 !important;
      }
      .impact-theme .text-gray-300 {
        color: #ffaaaa !important;
      }
      .impact-theme .text-gray-400 {
        color: #ff8888 !important;
      }
      .impact-theme .text-white {
        color: #ffcccc !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
